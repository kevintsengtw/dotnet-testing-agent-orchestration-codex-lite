# Codex workspace configuration for the Lite Unit Test workflow.
personality = "friendly"

[features]
multi_agent = true
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
max_depth = 1
max_threads = 6
job_max_runtime_seconds = 1800

# Hooks are optional telemetry only. Lite timing uses target run manifests.
